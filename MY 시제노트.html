<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MY 시제노트</title>
<style>
:root{--bg:#fff7f9;--card:#fff;--tx:#2b2226;--mu:#8a7a80;--pk:#e0457b;--ln:#f0dfe5;--ok:#1f8a5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1316;--card:#261c21;--tx:#f5eaee;--mu:#b5a1a9;--pk:#ff7aa5;--ln:#3a2a31;--ok:#5fd3a0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 10px}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:10px 0;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;font-weight:700;font-size:15px}
.tabs button.on{background:var(--pk);color:#fff;border-color:var(--pk)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:10px}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--pk);color:#fff;font-weight:700;font-size:14px}
.btn.g{background:var(--ln);color:var(--tx)}
.sum div{display:flex;justify-content:space-between;padding:3px 0}.sum .big{font-size:18px;font-weight:800;color:var(--ok);border-top:1px solid var(--ln);margin-top:4px;padding-top:6px}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}
.it img{width:44px;height:44px;object-fit:cover;border-radius:8px}.it .m{flex:1;min-width:0}.it .m small{color:var(--mu)}
.it b{white-space:nowrap}.tag{font-size:11px;background:var(--ln);border-radius:6px;padding:1px 6px;margin-left:4px}
.x{border:0;background:none;color:var(--mu);font-size:18px}
.pd{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.pd button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font-size:16px}
#ph img{max-width:100%;max-height:140px;border-radius:10px;margin-top:6px}
.ph{display:none}
@media print{.np{display:none!important}.ph{display:block}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}:root{--tx:#000;--mu:#444;--ok:#000;--ln:#ccc}}
</style></head><body><main>
<h1 class="np">📒 MY 시제노트</h1>
<div class="tabs np" id="tabs"></div>
<div class="pd"><button class="np" onclick="mv(-1)">‹</button><b id="pl"></b><button class="np" onclick="mv(1)">›</button></div>
<div class="card np" style="margin-top:8px"><div class="row" id="pr"></div></div>
<div class="ph" id="phd"></div>

<div class="card sum" id="sum"></div>

<div class="card np">
<b id="ft">내역 추가</b>
<div class="row"><div><label>날짜</label><input type="date" id="d"></div><div><label>구분</label><select id="k"><option>영수증</option><option>퀵비</option></select></div></div>
<label>거래처명 / 퀵 내용</label><input id="v" placeholder="예: 대한식자재">
<label>금액(원)</label><input id="a" type="number" inputmode="numeric" placeholder="0">
<label><input type="checkbox" id="mine" style="width:auto"> 내 돈으로 먼저 결제함 (나중에 돌려받을 금액)</label>
<label>영수증 사진</label><input type="file" id="f" accept="image/*" onchange="pic(this)">
<div id="ph"></div>
<div class="row" style="margin-top:10px"><button class="btn" onclick="add()" id="sb">추가</button><button class="btn g" onclick="rs()">초기화</button></div>
</div>

<div class="card" id="list"></div>

<div class="card np">
<div class="row"><button class="btn g" onclick="window.print()">🖨 정산서 인쇄</button><button class="btn g" onclick="csv()">📄 엑셀용(CSV)</button></div>
<div class="row" style="margin-top:8px"><button class="btn g" onclick="bk()">💾 백업</button><button class="btn g" onclick="rest()">♻️ 복원</button></div>
<textarea id="bx" rows="5" placeholder="백업·CSV 내용이 여기에 표시돼요. 복사해서 메모/메일에 보관하세요. 복원할 때는 백업 내용을 여기에 붙여넣고 '복원'을 누르세요." style="margin-top:8px"></textarea>
</div>
<p class="np" style="color:var(--mu);font-size:12px">기록은 이 기기의 브라우저에만 저장돼요. 정기적으로 백업해 주세요.</p>
</main>
<script>
const S=['오브','톤80','코벤트'],p=n=>String(n).padStart(2,'0'),$=i=>document.getElementById(i);
const iso=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR')+'원';
let db={e:[],s:{}},st=0,ed=null,photo='';
try{const r=JSON.parse(localStorage.getItem('sj')||'null');if(r&&r.e)db=r}catch(x){}
const save=()=>{try{localStorage.setItem('sj',JSON.stringify(db))}catch(x){alert('저장 공간이 부족해요. 백업 후 정리해 주세요.')}};
const T=new Date();let pm=new Date(T.getFullYear(),T.getMonth()-(T.getDate()<15?1:0),1);
const pk=()=>pm.getFullYear()+'-'+p(pm.getMonth()+1);
const rng=()=>{const o=(db.r||{})[pk()];return o?[o[0],o[1]]:[iso(new Date(pm.getFullYear(),pm.getMonth(),15)),iso(new Date(pm.getFullYear(),pm.getMonth()+1,14))]};
function setR(i,v){if(!v)return;const r=rng();r[i]=v;if(r[0]>r[1]){alert('시작일이 종료일보다 늦을 수 없어요.');render();return}db.r=db.r||{};db.r[pk()]=r;save();render()}
function resR(){if(db.r)delete db.r[pk()];save();render()}
const key=()=>st+'|'+pm.getFullYear()+'-'+p(pm.getMonth()+1);
function mv(n){pm=new Date(pm.getFullYear(),pm.getMonth()+n,1);render()}
function pic(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.6);$('ph').innerHTML='<img src="'+photo+'">'};im.src=r.result};r.readAsDataURL(f)}
function add(){const a=parseInt($('a').value,10),v=$('v').value.trim();if(!v||!(a>=0)){alert('거래처명과 금액을 입력해 주세요.');return}
const o={id:ed||Date.now(),s:st,d:$('d').value||iso(T),k:$('k').value,v,a,m:$('mine').checked,p:photo};
if(ed){const i=db.e.findIndex(x=>x.id===ed);db.e[i]=o}else db.e.push(o);save();rs();render()}
function rs(){ed=null;photo='';['v','a','f'].forEach(i=>$(i).value='');$('mine').checked=false;$('ph').innerHTML='';$('d').value=iso(T);$('sb').textContent='추가';$('ft').textContent='내역 추가'}
function edit(id){const o=db.e.find(x=>x.id===id);ed=id;photo=o.p||'';$('d').value=o.d;$('k').value=o.k;$('v').value=o.v;$('a').value=o.a;$('mine').checked=o.m;$('ph').innerHTML=photo?'<img src="'+photo+'">':'';$('sb').textContent='수정 저장';$('ft').textContent='내역 수정';scrollTo(0,0)}
function del(id){if(confirm('삭제할까요?')){db.e=db.e.filter(x=>x.id!==id);save();render()}}
function cfg(f,v){const k=key();db.s[k]=db.s[k]||{c:0,g:0};db.s[k][f]=parseInt(v,10)||0;save();render()}
const cur=()=>{const[a,b]=rng();return db.e.filter(x=>x.s===st&&x.d>=a&&x.d<=b).sort((x,y)=>x.d<y.d?-1:1)};
function render(){
$('tabs').innerHTML=S.map((n,i)=>'<button class="'+(i==st?'on':'')+'" onclick="st='+i+';rs();render()">'+n+'</button>').join('');
const[a,b]=rng(),L=cur(),c=db.s[key()]||{c:0,g:0};
$('pl').textContent=pk()+' 정산';$('pr').innerHTML='<div><label>시작일</label><input type="date" value="'+a+'" onchange="setR(0,this.value)"></div><div><label>종료일</label><input type="date" value="'+b+'" onchange="setR(1,this.value)"></div><div style="flex:0"><label>&nbsp;</label><button class="btn g" onclick="resR()">15~14일</button></div>';$('phd').innerHTML='<h2>'+S[st]+' 시제 정산서 ('+a+' ~ '+b+')</h2>';
const tot=L.reduce((s,x)=>s+x.a,0),my=L.filter(x=>x.m).reduce((s,x)=>s+x.a,0);
$('sum').innerHTML='<b>'+S[st]+' 정산 요약</b><div class="np row" style="margin:6px 0"><div><label>이월시제</label><input type="number" inputmode="numeric" value="'+c.c+'" onchange="cfg(\'c\',this.value)"></div><div><label>이번 달 받은 시제</label><input type="number" inputmode="numeric" value="'+c.g+'" onchange="cfg(\'g\',this.value)"></div></div>'
+'<div><span>이월시제</span><span>'+won(c.c)+'</span></div><div><span>받은 시제</span><span>'+won(c.g)+'</span></div><div><span>총 사용금액</span><span>'+won(tot)+'</span></div><div><span>내 돈 지출(돌려받을 금액)</span><span>'+won(my)+'</span></div><div class="big"><span>차액금</span><span>'+won(c.c+c.g-tot)+'</span></div>';
$('list').innerHTML='<b>내역 ('+L.length+'건)</b>'+(L.length?L.map(x=>'<div class="it">'+(x.p?'<img src="'+x.p+'">':'')+'<div class="m"><div>'+esc(x.v)+'<span class="tag">'+x.k+'</span>'+(x.m?'<span class="tag">내 돈</span>':'')+'</div><small>'+x.d+'</small></div><b>'+won(x.a)+'</b><span class="np"><button class="x" onclick="edit('+x.id+')">✏️</button><button class="x" onclick="del('+x.id+')">🗑</button></span></div>').join(''):'<p style="color:var(--mu)">이 기간에 입력된 내역이 없어요.</p>')}
function csv(){const L=cur(),q=s=>'"'+String(s).replace(/"/g,'""')+'"';$('bx').value='\ufeff날짜,구분,거래처,금액,내돈\n'+L.map(x=>[x.d,x.k,q(x.v),x.a,x.m?'Y':''].join(',')).join('\n');$('bx').select()}
function bk(){const o={e:db.e,s:db.s,r:db.r||{}};$('bx').value=JSON.stringify(o);$('bx').select()}
function rest(){try{const o=JSON.parse($('bx').value);if(!o.e||!o.s)throw 0;if(!confirm('현재 기록을 이 백업으로 덮어쓸까요?'))return;db=o;save();render();alert('복원했어요.')}catch(x){alert('백업 내용을 확인해 주세요.')}}
rs();render();
</script></body></html>
